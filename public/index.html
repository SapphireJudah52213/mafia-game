<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Mafia Multiplayer</title>

<link rel="stylesheet" href="style.css">

<style>
body{
    font-family:Arial,sans-serif;
    background:#222;
    color:white;
    text-align:center;
    padding:20px;
}

.card{
    background:#333;
    border-radius:12px;
    padding:20px;
    max-width:700px;
    margin:auto;
}

input{
    padding:10px;
    font-size:16px;
    margin:5px;
}

button{
    padding:10px 20px;
    font-size:16px;
    margin:5px;
    cursor:pointer;
}

.player{
    padding:10px;
    margin:5px;
    background:#444;
    border-radius:8px;
}

.dead{
    opacity:0.5;
    text-decoration:line-through;
}

#role{
    font-size:42px;
    font-weight:bold;
    margin-top:20px;
}

.voteButton{
    display:block;
    width:220px;
    margin:10px auto;
}
</style>
</head>
<body>

<h1>Mafia Multiplayer</h1>

<!-- HOME SCREEN -->

<div id="homeScreen" class="card">

    <h2>Create Room</h2>

    <button onclick="createRoom()">
        Create Room
    </button>

    <hr>

    <h2>Join Room</h2>

    <input
        id="playerName"
        placeholder="Nickname">

    <br>

    <input
        id="roomCode"
        placeholder="Room Code">

    <br>

    <button onclick="joinRoom()">
        Join Room
    </button>

</div>

<!-- LOBBY -->

<div
    id="lobbyScreen"
    class="card"
    style="display:none;">

    <h2>Lobby</h2>

    <h3>
        Room:
        <span id="roomCodeDisplay"></span>
    </h3>

    <p>
        Share this room code with
        your friends.
    </p>

    <div id="playerList"></div>

    <hr>

    <h3>Role Counts</h3>

    <label>Mafia:</label>

    <input
        id="mafiaCount"
        type="number"
        value="1"
        min="1">

    <br>

    <label>Nurse:</label>

    <input
        id="nurseCount"
        type="number"
        value="1"
        min="0">

    <br>

    <label>Butcher:</label>

    <input
        id="butcherCount"
        type="number"
        value="1"
        min="0">

    <br><br>

    <button
        id="startButton"
        onclick="startGame()">

        Start Game
    </button>

</div>

<!-- ROLE SCREEN -->

<div
    id="roleScreen"
    class="card"
    style="display:none;">

    <h2>Your Role</h2>

    <div id="role">
        Waiting...
    </div>

    <br>

    <button onclick="hideRole()">
        Continue
    </button>

</div>

<!-- GAME SCREEN -->

<div
    id="gameScreen"
    class="card"
    style="display:none;">

    <h2 id="phaseTitle">
        Waiting...
    </h2>

    <h3>
        Night:
        <span id="turnNumber">
            1
        </span>
    </h3>

    <div id="gameContent"></div>

</div>

<!-- VOTING SCREEN -->

<div
    id="votingScreen"
    class="card"
    style="display:none;">

    <h2>Vote</h2>

    <div id="voteTargets"></div>

</div>

<!-- RESULTS -->

<div
    id="resultsScreen"
    class="card"
    style="display:none;">

    <h2>Results</h2>

    <div id="resultsContent"></div>

</div>

<!-- DEBUG STATUS -->

<div
    class="card"
    style="margin-top:20px;">

    <h3>Status</h3>

    <p>
        Room:
        <span id="statusRoom">
            -
        </span>
    </p>

    <p>
        Phase:
        <span id="statusPhase">
            -
        </span>
    </p>

    <p>
        Connected:
        <span id="statusConnection">
            Yes
        </span>
    </p>

</div>

<script src="app.js"></script>

</body>
</html>
